<!doctype html>
<html lang="{{ .Language.Lang }}" dir="{{ .Language.Direction | default "auto" }}">
<head>
  <meta charset="utf-8" />
  <title>{{ .Title }} — Sourcentis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
  <link rel="icon" href="{{ "favicon-32x32.png" | absURL }}">
  <!--
    This page embeds the published npm package directly from esm.sh — no
    build step on the Hugo side. esm.sh resolves @sourcentis/bpmn-editor's
    @maxgraph/core peer dependency to its own absolute URL internally, so
    there's no need to also map "@maxgraph/core" here (and no risk of two
    separate MaxGraph module instances on the page). Bump the version
    below whenever a new @sourcentis/bpmn-editor version is released
    (check with `npm view @sourcentis/bpmn-editor version`).
  -->
<script type="importmap">
  {
    "imports": {
      "@sourcentis/bpmn-editor": "https://esm.sh/@sourcentis/bpmn-editor@latest"
    }
  }
</script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
    }
    header.bpmn-topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      flex: 0 0 auto;
    }
    header.bpmn-topbar a.brand {
      font-size: 13px;
      color: #6b7280;
      text-decoration: none;
      white-space: nowrap;
    }
    header.bpmn-topbar a.brand:hover { color: #111827; }
    header.bpmn-topbar h1 {
      font-size: 16px;
      margin: 0;
      flex: 1 1 auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #111827;
    }
    header.bpmn-topbar a.github {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #111827;
      text-decoration: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 10px;
      white-space: nowrap;
    }
    header.bpmn-topbar a.github:hover { background: #f3f4f6; }
    header.bpmn-topbar a.github svg { width: 16px; height: 16px; flex: none; }
    #editor { flex: 1 1 auto; min-height: 0; }
  </style>
</head>
<body>
  <header class="bpmn-topbar">
    <a class="brand" href="{{ "/" | absLangURL }}">← Sourcentis</a>
    <h1>@sourcentis/bpmn-editor</h1>
    <a class="github" href="https://github.com/sourcentis/bpmn-editor" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                 -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                 .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
                 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82
                 .64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82
                 .44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95
                 .29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      GitHub
    </a>
  </header>

  <div id="editor"></div>

  <script type="module">
    import { createBpmnEditor } from '@sourcentis/bpmn-editor';

    const editor = createBpmnEditor(document.getElementById('editor'), { ui: 'default' });
    editor.on('error', (err) => console.error('[bpmn-editor]', err));
  </script>
</body>
</html>
